<!DOCTYPE html>
<html>

<head>
    <title>Connection Successful - LingoFetch</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary: #592171;
            --text-main: #1f2937;
            --text-muted: #4b5563;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            color: var(--text-main);
            padding: 2rem;
            text-align: center;
        }

        .content {
            width: 100%;
            max-width: 600px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 800;
            letter-spacing: -0.025em;
        }

        p {
            color: var(--text-muted);
            font-size: 1.25rem;
            line-height: 1.6;
        }

        .hero-image {
            width: 100%;
            max-width: 400px;
            height: auto;
            margin: 2rem auto;
            display: block;
        }

        .provider-badge {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 1.25rem;
            margin: 0.5rem 0 2rem 0;
        }

        .footer-note {
            margin-top: 3rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            opacity: 0.7;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }

            p {
                font-size: 1.1rem;
            }

            .hero-image {
                max-width: 300px;
            }
        }
    </style>
</head>

<body>
    <div class="content">
        <h1>Connection Successful!</h1>
        <p>LingoFetch is now connected to</p>

        <img src="/assets/images/auth/lf_connection_bg.png" alt="Success" class="hero-image">

        <div class="provider-badge">[PROVIDER]</div>

        <p>You can close this window and return to the extension.</p>

        <div class="footer-note">
            This window will close automatically in a few seconds.
        </div>
    </div>

    <script>
        setTimeout(() => {
            window.close();
        }, 5000);
    </script>
</body>

</html>
