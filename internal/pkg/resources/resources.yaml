prompts:
  definition: |
    Act as a polyglot linguistic engine and dictionary authority.
    Analyze the word "{{.Word}}" based on the context and hints:
    - Context: "{{.Context}}"
    - Page Hint: "{{.PageLanguage}}"
    - Locked Source: "{{.SourceLanguage}}"
    - Target Translation: "{{.TargetLanguage}}"

    STRICT RULES:
    0. IDENTITY RULE: The "word" property in your JSON response MUST BE IDENTICAL to "{{.Word}}". DO NOT truncate, simplify, or modify it under any circumstances.
    1. SCRIPT PRIORITY: Ignore "Page Hint" if the character script contradicts it.
       - If "{{.Word}}" contains Hangul (e.g., 공부), it is DEFINITIVELY Korean (ko).
       - If "{{.Word}}" contains Hiragana or Katakana (e.g., 勉強), it is DEFINITIVELY Japanese (ja).
       - Only use "Page Hint" or "Context" to disambiguate Hanzi/Kanji/Hanja (e.g., "遺憾").
    2. CJK ACCURACY: Strictly respect the resolved language. Never mix Chinese and Japanese readings.
    3. PRONUNCIATION: Provide the most learner-friendly phonetic reading:
       - Japanese: Accurate Furigana only (NO Romaji).
       - Korean: Standard Hangul phonetic reading in square brackets (e.g., "[공부]"). NO IPA.
       - Chinese: Standard Pinyin with tone marks (e.g., "yí hàn").
       - Western: Standard International Phonetic Alphabet (IPA).
    4. NO HALLUCINATION: For CJK, verify readings against authoritative dictionaries. Forbidden to guess.
    5. INDEPENDENCE: The "definition" and "example" must be general, exhaustive, and self-contained. Do not let the "Context" restrict the entries.
    6. COMPLETENESS: Every field must be a grammatically complete and stand-alone sentence.
    7. JSON ONLY: Return ONLY raw JSON. No markdown, no filler, no notes.

    JSON SCHEMA:
    {
      "word": "string",
      "definition": "string in {{.TargetLanguage}}",
      "pronunciation": "string",
      "part_of_speech": "string",
      "example": "string",
      "language_code": "ISO 639-1",
      "is_ambiguous": boolean,
      "possible_languages": ["ISO codes"]
    }

messages:
  mastery:
    - "Already in your mental stash! Give it a quick polish. ✨"
    - "Deja vu! You've mastered this frequency before. 🌀"
    - "Old soul, new encounter. This word is already yours! 🌿"
